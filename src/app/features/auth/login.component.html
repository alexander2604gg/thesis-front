<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Iniciar Sesión</h1>
      <p>Ingresa tus datos a continuación</p>
    </div>

    <form *ngIf="!isRegisterMode" (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="text" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          class="form-input"
          placeholder="Ingresa tu email"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          class="form-input"
          placeholder="Ingresa tu contraseña"
        >
      </div>

      <div class="forgot-password">
        <a href="#" (click)="forgotPassword()" class="forgot-link">Olvidé mi contraseña</a>
        <button type="button" (click)="toggleRegister($event)" class="link-button forgot-link">Crear cuenta</button>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="login-button" 
        [disabled]="loading || !loginForm.valid"
      >
        <span *ngIf="loading">Cargando...</span>
        <span *ngIf="!loading">Continuar</span>
      </button>
    </form>

    <!-- Registro -->
    <form *ngIf="isRegisterMode" (ngSubmit)="onRegister()" #registerForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="regEmail">Correo electrónico</label>
        <input type="email" id="regEmail" name="regEmail" [(ngModel)]="regEmail" required class="form-input" placeholder="tu@correo.com">
      </div>
      <div class="form-group">
        <label for="regPassword">Contraseña</label>
        <input type="password" id="regPassword" name="regPassword" [(ngModel)]="regPassword" required class="form-input" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="firstName">Nombre</label>
        <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" required class="form-input" placeholder="Nombre">
      </div>
      <div class="form-group">
        <label for="secondName">Apellido</label>
        <input type="text" id="secondName" name="secondName" [(ngModel)]="secondName" class="form-input" placeholder="Apellido">
      </div>
      <div class="form-group">
        <label for="country">País</label>
        <input type="text" id="country" name="country" [(ngModel)]="country" class="form-input" placeholder="País">
      </div>
      <div class="form-group">
        <label for="phoneNumber">Teléfono</label>
        <input type="text" id="phoneNumber" name="phoneNumber" [(ngModel)]="phoneNumber" class="form-input" placeholder="+51...">
      </div>

      <div class="forgot-password">
        <button type="button" (click)="toggleRegister($event)" class="link-button forgot-link">Volver a iniciar sesión</button>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" class="login-button" [disabled]="loading || !registerForm.valid">
        <span *ngIf="loading">Creando cuenta...</span>
        <span *ngIf="!loading">Registrarme</span>
      </button>
    </form>
  </div>
</div>
